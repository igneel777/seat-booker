services:
  api:
    build: .
    image: seat-booker-api:latest
    container_name: seat-booker-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/liveness')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
