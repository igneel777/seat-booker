services:
  postgres:
    image: postgres:16-alpine
    container_name: seat-booker-postgres
    # No volume on purpose: every start is a clean DB (see DECISIONS.md #1).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatbooker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatbooker}
      POSTGRES_DB: ${POSTGRES_DB:-seatbooker}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: seat-booker-api:latest
    container_name: seat-booker-api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-seatbooker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-seatbooker}
      DB_NAME: ${POSTGRES_DB:-seatbooker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/liveness')"]
      interval: 300s
      timeout: 3s
      start_period: 5s
      retries: 3
