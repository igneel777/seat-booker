[project]
name = "seat-booker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (incl. F401 unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["middlewares", "routes", "settings", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
